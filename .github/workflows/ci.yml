# Continuous integration: checks every pull request and every push to main.
# It only tests and builds. It never deploys or publishes the app.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); the tag is in the comment.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22 matches package.json "engines" (>=22.12) and runs on macOS Big Sur;
      # Node 24+ does not, so the version is pinned to the 22 line on purpose.
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      # `--if-present` runs a step only when that script exists in package.json.
      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Unit and component tests
        run: npm test --if-present

      - name: Production build
        run: npm run build --if-present

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (builds first)
        run: npm run test:e2e --if-present

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
